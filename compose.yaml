# T3UD-GSB11 – Government Site Builder 11 als lokaler Docker-Stack.
# Alle Werte kommen aus .env, erzeugt von scripts/setup.sh.
#
# T3UD-GSB11 – Government Site Builder 11 as a local Docker stack.
# All values come from .env, generated by scripts/setup.sh.

name: t3ud-gsb11

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: ./docker/nginx
      # Beim Rebuild immer das aktuellste Base-Image ziehen (Security-Patches)
      # Always pull the latest base image on rebuild (security patches)
      pull: true
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    # BIND_IP bestimmt, auf welcher Host-Adresse der Port erscheint. Default
    # 127.0.0.1: der Stack ist ausschließlich vom Notebook selbst erreichbar.
    # Für die Veröffentlichung im Netz siehe docs/reverse-proxy.md – Docker
    # umgeht Host-Firewalls, die Bind-Adresse ist hier die eigentliche Grenze.
    # BIND_IP controls which host address publishes the port. Default 127.0.0.1
    # keeps the stack reachable from the laptop only. See docs/reverse-proxy.md
    # before exposing it – Docker bypasses host firewalls, so the bind address
    # is the actual boundary.
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/html:ro
    # Härtung: Root-FS unveränderlich, Schreibpfade als tmpfs, keine
    # Privilegien-Eskalation (setuid) im Container.
    # Hardening: immutable root FS, writable paths as tmpfs, no privilege
    # escalation (setuid) inside the container.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    logging: *default-logging
    networks: [gsb]

  php:
    build:
      context: ./docker/php
      pull: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/var/www/html
    security_opt:
      - no-new-privileges:true
    # FPM-Ping (docker/php/fpm-healthcheck.conf) direkt über FastCGI abfragen
    # Query the FPM ping (docker/php/fpm-healthcheck.conf) directly via FastCGI
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      # ---- Verbindung für das Setup-Skript / connection for the setup script ----
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:-gsb11}"
      DB_USER: "${DB_USER:-gsb11}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      TYPO3_ADMIN_USER: "${TYPO3_ADMIN_USER:-admin}"
      TYPO3_ADMIN_PASSWORD: "${TYPO3_ADMIN_PASSWORD:?Set TYPO3_ADMIN_PASSWORD in .env}"
      TYPO3_ADMIN_EMAIL: "${TYPO3_ADMIN_EMAIL:-}"

      # ---- Basis-URL der Seite / site base URL ----
      GSB_SCHEME: "${GSB_SCHEME:-http}"
      FRONTEND_DOMAIN: "${FRONTEND_DOMAIN:-localhost:8080}"
      BACKEND_DOMAIN: "${BACKEND_DOMAIN:-${FRONTEND_DOMAIN:-localhost:8080}}"

      # ===================================================================
      # Offizieller GSB11-Einstellungsblock
      # (1:1 aus .ddev/docker-compose.environment.yaml des Sitepackage-
      #  Kickstarters – die Einstellungen, die der GSB11 mitbringt)
      # Official GSB11 settings block (verbatim from the kickstarter's
      # .ddev/docker-compose.environment.yaml)
      # ===================================================================
      TYPO3__APPLICATION__context: "${TYPO3_CONTEXT:-Production}"
      TYPO3__SYS__trustedHostsPattern: "${TRUSTED_HOSTS_PATTERN:-.*}"
      TYPO3__SYS__features__brandingBackendLogin: "true"
      TYPO3__DB__Connections__Default__driver: mysqli
      TYPO3__DB__Connections__Default__host: db
      TYPO3__DB__Connections__Default__port: "3306"
      TYPO3__DB__Connections__Default__dbname: "${DB_NAME:-gsb11}"
      TYPO3__DB__Connections__Default__user: "${DB_USER:-gsb11}"
      TYPO3__DB__Connections__Default__password: "${DB_PASSWORD}"
      TYPO3__EXTENSIONS__backend__backendFavicon: "EXT:gsb_core/Resources/Public/Favicons/favicon-32x32.png"
      TYPO3__EXTENSIONS__backend__backendLogo: "EXT:gsb_core/Resources/Public/Favicons/favicon.ico"
      TYPO3__EXTENSIONS__backend__loginBackgroundImage: "EXT:gsb_core/Resources/Public/Images/bg.jpg"
      TYPO3__EXTENSIONS__backend__loginFootnote: "${BACKEND_LOGIN_FOOTNOTE:-© GSB - ITZBund}"
      TYPO3__EXTENSIONS__backend__loginHighlightColor: "#004b76"
      TYPO3__EXTENSIONS__backend__loginLogo: "EXT:gsb_core/Resources/Public/Favicons/web-app-manifest-192x192.png"
      TYPO3__EXTENSIONS__backend__loginLogoAlt: "${BACKEND_LOGIN_LOGO_ALT:-GSB - ITZBund}"
      TYPO3__EXTENSIONS__gsb_core__additionalAllowedFileExtensionsForUploadsElement: "docx,xlsx"
      TYPO3__EXTENSIONS__gsb_core__allowedAudioDomains: "${ALLOWED_MEDIA_DOMAINS:-*}"
      TYPO3__EXTENSIONS__gsb_core__allowedVideoDomains: "${ALLOWED_MEDIA_DOMAINS:-*}"

      # ---- Betrieb hinter einem Reverse Proxy / behind a reverse proxy ----
      # Nur relevant, wenn die Seite nach außen veröffentlicht wird. Leer =
      # Auswertung der X-Forwarded-Header deaktiviert. Siehe docs/reverse-proxy.md.
      # Only relevant when publishing the site. Empty = X-Forwarded headers are
      # ignored. See docs/reverse-proxy.md.
      TYPO3__SYS__reverseProxyIP: "${REVERSE_PROXY_IP:-}"
      TYPO3__SYS__reverseProxySSL: "${REVERSE_PROXY_SSL:-}"

      # ---- E-Mail-Versand / mail delivery ----
      # Ohne SMTP bleibt transport=sendmail – im Image gibt es kein sendmail,
      # Mails schlagen dann fehl. Für die lokale Demo ohne Belang.
      # Without SMTP the transport stays 'sendmail'; the image has no sendmail
      # binary, so mail will fail. Irrelevant for the local demo.
      TYPO3__MAIL__transport: "${MAIL_TRANSPORT:-sendmail}"
      TYPO3__MAIL__transport_smtp_server: "${MAIL_SMTP_SERVER:-}"
      TYPO3__MAIL__transport_smtp_encrypt: "${MAIL_SMTP_ENCRYPT:-}"
      TYPO3__MAIL__transport_smtp_username: "${MAIL_SMTP_USER:-}"
      TYPO3__MAIL__transport_smtp_password: "${MAIL_SMTP_PASSWORD:-}"
      TYPO3__MAIL__defaultMailFromAddress: "${MAIL_FROM_ADDRESS:-}"
      TYPO3__MAIL__defaultMailFromName: "${MAIL_FROM_NAME:-}"
    # Obergrenze, keine Reservierung: schützt das Notebook vor einem
    # amoklaufenden Container. Bei Bedarf an die Hostgröße anpassen.
    # Upper bound, not a reservation: protects the laptop from a runaway
    # container. Adjust to the host size if needed.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging: *default-logging
    networks: [gsb]

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_NAME:-gsb11}"
      MARIADB_USER: "${DB_USER:-gsb11}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
    volumes:
      - db-data:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    logging: *default-logging
    networks: [gsb]

volumes:
  db-data:

networks:
  gsb:
    driver: bridge
