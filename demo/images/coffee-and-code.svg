<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768" role="img" aria-label="Stilisierter Bildschirm mit Programmcode neben einer Kaffeetasse">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00525c"/>
      <stop offset="100%" stop-color="#1c2226"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f3f7fb" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#f3f7fb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="768" fill="url(#room)"/>

  <!-- Editorfenster / editor window -->
  <rect x="96" y="120" width="640" height="440" rx="16" fill="#1c2226"/>
  <rect x="96" y="120" width="640" height="44" rx="16" fill="#0b4d59"/>
  <rect x="96" y="148" width="640" height="16" fill="#0b4d59"/>
  <g>
    <circle cx="128" cy="142" r="8" fill="#780f2d"/>
    <circle cx="154" cy="142" r="8" fill="#f7bb3d"/>
    <circle cx="180" cy="142" r="8" fill="#00854a"/>
  </g>

  <!-- Zeilennummern / line numbers -->
  <g fill="#4f5b5f">
    <rect x="126" y="200" width="18" height="8" rx="4"/>
    <rect x="126" y="232" width="18" height="8" rx="4"/>
    <rect x="126" y="264" width="18" height="8" rx="4"/>
    <rect x="126" y="296" width="18" height="8" rx="4"/>
    <rect x="126" y="328" width="18" height="8" rx="4"/>
    <rect x="126" y="360" width="18" height="8" rx="4"/>
    <rect x="126" y="392" width="18" height="8" rx="4"/>
    <rect x="126" y="424" width="18" height="8" rx="4"/>
    <rect x="126" y="456" width="18" height="8" rx="4"/>
    <rect x="126" y="488" width="18" height="8" rx="4"/>
  </g>

  <!-- Code / code lines -->
  <g rx="4">
    <rect x="172" y="198" width="120" height="12" rx="6" fill="#66ddec"/>
    <rect x="304" y="198" width="180" height="12" rx="6" fill="#80cdec" opacity=".7"/>
    <rect x="196" y="230" width="90" height="12" rx="6" fill="#f7bb3d"/>
    <rect x="298" y="230" width="220" height="12" rx="6" fill="#f3f7fb" opacity=".55"/>
    <rect x="196" y="262" width="150" height="12" rx="6" fill="#80cdec" opacity=".7"/>
    <rect x="220" y="294" width="200" height="12" rx="6" fill="#f3f7fb" opacity=".45"/>
    <rect x="220" y="326" width="120" height="12" rx="6" fill="#66ddec"/>
    <rect x="352" y="326" width="160" height="12" rx="6" fill="#f7bb3d" opacity=".8"/>
    <rect x="196" y="358" width="260" height="12" rx="6" fill="#f3f7fb" opacity=".45"/>
    <rect x="196" y="390" width="110" height="12" rx="6" fill="#80cdec" opacity=".7"/>
    <rect x="172" y="422" width="80" height="12" rx="6" fill="#66ddec"/>
    <rect x="172" y="454" width="180" height="12" rx="6" fill="#f3f7fb" opacity=".35"/>
    <rect x="172" y="486" width="14" height="12" rx="3" fill="#66ddec"/>
  </g>

  <!-- Kaffeetasse / coffee mug -->
  <g transform="translate(770 380)">
    <path d="M120 8h34a44 44 0 0 1 0 88h-34z" fill="none" stroke="#f3f7fb" stroke-width="14"/>
    <rect x="0" y="0" width="130" height="150" rx="16" fill="#f3f7fb"/>
    <rect x="16" y="18" width="98" height="30" rx="12" fill="#4f5b5f" opacity=".55"/>
    <rect x="-24" y="152" width="178" height="16" rx="8" fill="#0b4d59"/>
  </g>

  <!-- Dampf / steam -->
  <g stroke="url(#steam)" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M812 350c-16-24 16-40 0-64s16-40 0-58"/>
    <path d="M866 350c-16-24 16-40 0-64s16-40 0-58"/>
  </g>
</svg>
