<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768" role="img" aria-label="Stilisierter Workshop-Tisch mit Laptops und Notizzetteln von oben">
  <defs>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b4d59"/>
      <stop offset="100%" stop-color="#00525c"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66ddec"/>
      <stop offset="100%" stop-color="#007a89"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="768" fill="url(#table)"/>

  <!-- Tischplatte / table top -->
  <rect x="72" y="150" width="880" height="468" rx="28" fill="#f3f7fb" opacity=".12"/>

  <!-- Laptop oben links / laptop top left -->
  <g transform="translate(150 196)">
    <rect width="230" height="150" rx="10" fill="url(#lid)"/>
    <rect x="16" y="16" width="198" height="118" rx="5" fill="#1c2226" opacity=".82"/>
    <g fill="#66ddec" opacity=".85">
      <rect x="34" y="38" width="90" height="9" rx="4"/>
      <rect x="34" y="58" width="140" height="9" rx="4"/>
      <rect x="34" y="78" width="62" height="9" rx="4"/>
      <rect x="34" y="98" width="112" height="9" rx="4"/>
    </g>
    <rect x="-16" y="158" width="262" height="18" rx="9" fill="#80cdec" opacity=".55"/>
  </g>

  <!-- Laptop oben rechts / laptop top right -->
  <g transform="translate(600 210)">
    <rect width="230" height="150" rx="10" fill="url(#lid)"/>
    <rect x="16" y="16" width="198" height="118" rx="5" fill="#1c2226" opacity=".82"/>
    <g fill="#80cdec" opacity=".85">
      <rect x="34" y="38" width="130" height="9" rx="4"/>
      <rect x="34" y="58" width="72" height="9" rx="4"/>
      <rect x="34" y="78" width="150" height="9" rx="4"/>
      <rect x="34" y="98" width="96" height="9" rx="4"/>
    </g>
    <rect x="-16" y="158" width="262" height="18" rx="9" fill="#80cdec" opacity=".55"/>
  </g>

  <!-- Laptop unten mitte / laptop bottom centre -->
  <g transform="translate(392 430)">
    <rect width="250" height="162" rx="10" fill="url(#lid)"/>
    <rect x="18" y="18" width="214" height="126" rx="5" fill="#1c2226" opacity=".82"/>
    <g fill="#66ddec" opacity=".85">
      <rect x="38" y="42" width="104" height="10" rx="5"/>
      <rect x="38" y="64" width="152" height="10" rx="5"/>
      <rect x="38" y="86" width="80" height="10" rx="5"/>
      <rect x="38" y="108" width="128" height="10" rx="5"/>
    </g>
    <rect x="-16" y="170" width="282" height="20" rx="10" fill="#80cdec" opacity=".55"/>
  </g>

  <!-- Haftnotizen / sticky notes -->
  <g>
    <rect x="132" y="470" width="96" height="96" rx="6" fill="#f7bb3d" transform="rotate(-7 180 518)"/>
    <rect x="246" y="512" width="88" height="88" rx="6" fill="#66ddec" transform="rotate(6 290 556)"/>
    <rect x="718" y="452" width="96" height="96" rx="6" fill="#f7bb3d" opacity=".85" transform="rotate(9 766 500)"/>
    <rect x="828" y="536" width="82" height="82" rx="6" fill="#80cdec" transform="rotate(-5 869 577)"/>
  </g>

  <!-- Kaffeebecher / coffee cups -->
  <g fill="#f3f7fb">
    <circle cx="466" cy="256" r="34"/>
    <circle cx="466" cy="256" r="22" fill="#1c2226" opacity=".7"/>
    <circle cx="900" cy="418" r="30"/>
    <circle cx="900" cy="418" r="19" fill="#1c2226" opacity=".7"/>
  </g>

  <!-- Stift / pen -->
  <rect x="352" y="640" width="150" height="14" rx="7" fill="#f3f7fb" opacity=".8" transform="rotate(-12 427 647)"/>
</svg>
