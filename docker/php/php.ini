; PHP-Einstellungen gemäß TYPO3-/GSB11-Systemanforderungen
; (orientiert am offiziellen GSB11-DDEV-Webimage)
; PHP settings per TYPO3/GSB11 requirements (aligned with the official DDEV webimage)

; PHP-Version nicht im X-Powered-By-Header preisgeben
; Do not disclose the PHP version via the X-Powered-By header
expose_php = Off

memory_limit = 512M
max_execution_time = 240
max_input_vars = 1500
upload_max_filesize = 32M
post_max_size = 32M

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
